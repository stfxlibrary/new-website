<!-- Library Hours Table Widget -->
<!-- Fetches live hours from LibCal JSON API and renders a grouped table. -->
<!-- Code can be found here: https://github.com/stfxlibrary/new-website/blob/main/hours-table.html -->
<p>&nbsp;</p>
<h2 class="sg-section-header h-teaser">Today's Hours</h2>

<div id="stfx-hours-table-widget">&nbsp;</div>

<style>
#stfx-hours-table-widget {
    font-family: 'Lato', 'Helvetica Neue', Arial, sans-serif;
    color: #222;
    line-height: normal;
    margin-top: 0.5rem;
    max-width: 377px;
}
.sht-day-label {
    font-size: 0.8125rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #425f8e;
    margin: 0 0 0.4rem 0;
}
.sht-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9375rem;
}
.sht-table thead th {
    background-color: #001b40;
    color: #fff;
    font-weight: 600;
    font-size: 0.8125rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.5rem 0.75rem;
    text-align: left;
}
.sht-table thead th:last-child {
    text-align: center;
}
.sht-row-library td {
    background-color: #eef1f7;
    font-weight: 700;
    color: #001b40;
    padding: 0.5rem 0.75rem;
    border-top: 2px solid #001b40;
    border-bottom: 1px solid #c5cfe0;
}
.sht-row-dept td {
    background-color: #fff;
    padding: 0.35rem 0.75rem 0.35rem 1.5rem;
    border-bottom: 1px solid #e8ecf3;
    color: #333;
    font-size: 0.9rem;
}
.sht-row-dept:last-of-type td,
.sht-row-dept.sht-last-in-group td {
    border-bottom: none;
}
.sht-name-link {
    text-decoration: none;
}
.sht-row-library .sht-name-link {
    color: #001b40;
}
.sht-row-dept .sht-name-link {
    color: #425f8e;
}
.sht-name-link:hover,
.sht-name-link:focus {
    text-decoration: underline;
}
.sht-col-hours {
    color: #444;
}
.sht-col-status {
    text-align: center;
    white-space: nowrap;
}
.sht-badge {
    display: inline-block;
    padding: 0.15rem 0.55rem;
    border-radius: 2rem;
    font-size: 0.75rem;
    font-weight: 700;
    line-height: 1.4;
}
.sht-badge-open    { background-color: #d4edda; color: #155724; }
.sht-badge-closed  { background-color: #f8d7da; color: #721c24; }
.sht-badge-byapp   { background-color: #e2e8f0; color: #425f8e; }
.sht-badge-24hrs   { background-color: #d1ecf1; color: #0c5460; }
.sht-footnote {
    font-size: 0.8125rem;
    color: #555;
    margin: 0.4rem 0 0.75rem 0;
    padding: 0.4rem 0.6rem;
    border-left: 3px solid #425f8e;
    background: #f5f7fb;
    line-height: 1.4;
}
.sht-error {
    color: #721c24;
    font-size: 0.9rem;
}
.sht-table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}
@media (max-width: 377px) {
    .sht-table thead {
        display: none;
    }
    .sht-table,
    .sht-table tbody,
    .sht-table tr,
    .sht-table td {
        display: block;
        width: 100%;
        box-sizing: border-box;
    }
    .sht-table tr {
        border-top: 2px solid #001b40;
    }
    .sht-table td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.4rem 0.75rem;
        border-top: none;
        border-bottom: 1px solid #e8ecf3;
    }
    .sht-table td::before {
        content: attr(data-label);
        flex-shrink: 0;
        margin-right: 1rem;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #425f8e;
    }
    .sht-row-library td {
        border-bottom: 1px solid #c5cfe0;
        border-top: none;
    }
    .sht-row-library td::before {
        color: #001b40;
    }
    .sht-row-dept td {
        padding-left: 0.75rem;
    }
    .sht-col-status {
        text-align: right;
    }
}
</style>

<script>
(function () {
    var container = document.getElementById('stfx-hours-table-widget');
    var API_URL = 'https://stfx.libcal.com/api_hours_today.php?lid=0&format=json&systemTime=0';

    function badge(loc) {
        var s = loc.times && loc.times.status ? loc.times.status : 'closed';
        var isOpen = loc.times && loc.times.currently_open;
        if (s === '24hrs')  return '<span class="sht-badge sht-badge-24hrs">24 Hours</span>';
        if (s === 'ByApp')  return '<span class="sht-badge sht-badge-byapp">By Appt.</span>';
        if (isOpen)         return '<span class="sht-badge sht-badge-open">Open</span>';
        return                     '<span class="sht-badge sht-badge-closed">Closed</span>';
    }

    function hoursCell(loc) {
        return (loc.rendered || '&mdash;').replace(/, /g, '<br>');
    }

    function nameCell(loc, isLib) {
        var n = loc.name || '';
        var u = (loc.url || '').trim();
        if (u) {
            return '<a class="sht-name-link" href="' + u + '" target="_blank" rel="noopener">' + n + '</a>';
        }
        return n;
    }

    function render(data) {
        var locs = (data && data.locations) ? data.locations : [];
        if (!locs.length) {
            container.innerHTML = '<p class="sht-error">No hours data available. Visit our <a href="https://stfx.libcal.com/hours/">hours page</a>.</p>';
            return;
        }

        var day = locs[0].day || '';

        /* Build parent→children map */
        var children = {};
        locs.forEach(function (l) {
            if (l.parent_lid) {
                if (!children[l.parent_lid]) children[l.parent_lid] = [];
                children[l.parent_lid].push(l);
            }
        });

        /* Top-level locations (no parent_lid) */
        var topLevel = locs.filter(function (l) { return !l.parent_lid; });

        var rows = '';
        var footnotes = '';

        topLevel.forEach(function (lib) {
            var kids = children[lib.lid] || [];

            rows += '<tr class="sht-row-library">'
                + '<td data-label="Location">' + nameCell(lib, true) + '</td>'
                + '<td data-label="Hours" class="sht-col-hours">' + hoursCell(lib) + '</td>'
                + '</tr>';

            kids.forEach(function (dept, idx) {
                var isLast = (idx === kids.length - 1);
                rows += '<tr class="sht-row-dept' + (isLast ? ' sht-last-in-group' : '') + '">'
                    + '<td data-label="Location">' + nameCell(dept, false) + '</td>'
                    + '<td data-label="Hours" class="sht-col-hours">' + hoursCell(dept) + '</td>'
                    + '</tr>';
            });

            if (lib.fn) {
                footnotes += '<p class="sht-footnote">' + lib.fn + '</p>';
            }
        });

        var html = '<div class="sht-table-wrap"><table class="sht-table">'
            + '<thead><tr>'
            + '<th>Location</th>'
            + '<th>Hours</th>'
            + '</tr></thead>'
            + '<tbody>' + rows + '</tbody>'
            + '</table></div>'
            + footnotes
            + '<p class="sht-view-all"><a href="https://stfx.libcal.com/hours/" target="_blank" rel="noopener">View all Hours</a></p>';

        container.innerHTML = html;
    }

    var cbName = 'shtCb' + Date.now();
    window[cbName] = function (data) {
        delete window[cbName];
        script.parentNode && script.parentNode.removeChild(script);
        render(data);
    };
    var script = document.createElement('script');
    script.onerror = function () {
        delete window[cbName];
        container.innerHTML = '<p class="sht-error">Unable to load hours. Visit our '
            + '<a href="https://stfx.libcal.com/hours/">hours page</a> for current times.</p>';
    };
    script.src = API_URL + '&callback=' + cbName;
    document.head.appendChild(script);
}());
</script>
